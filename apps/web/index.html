<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AgendIA: reserva en barberías, clínicas, peluquerías y más, con la agenda siempre al día."
    />
    <meta name="theme-color" content="#1c1917" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c1917'/%3E%3Cpath d='M9 12h14M11 8v3m10-3v3M10 12h12v11H10z' stroke='%23c89b3c' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>AgendIA</title>
    <script>
      // Aplica el tema antes de pintar para que no parpadee el modo claro al abrir en oscuro.
      try {
        var saved = localStorage.getItem("agendia-theme");
        var dark =
          saved === "dark" ||
          (saved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>AgendIA necesita JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
