name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    # Postgres real para los tests de integración (restricciones, concurrencia, búsqueda)
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agendia
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: agendia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agendia"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://agendia:ci@localhost:5432/agendia
    steps:
      - uses: actions/checkout@v7
      # La versión de pnpm se lee del campo "packageManager" de package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validar docker-compose.yml con .env.example
        run: |
          cp .env.example .env
          docker compose config --quiet
